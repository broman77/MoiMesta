name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout project
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Configure Android SDK path
        shell: bash
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_DIR" ]; then
            echo "Android SDK not found at: $SDK_DIR"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          printf 'sdk.dir=%s\n' "$SDK_DIR" > local.properties
          echo "Using Android SDK: $SDK_DIR"
          echo "Available platforms:"
          ls -1 "$SDK_DIR/platforms" 2>/dev/null || true
          echo "Available build-tools:"
          ls -1 "$SDK_DIR/build-tools" 2>/dev/null || true

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          java -version
          gradle --version
          gradle --no-daemon --stacktrace --warning-mode all :app:assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          echo "Built APK files:"
          find app/build/outputs/apk -type f -name '*.apk' -print
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "Expected APK not found: $APK"
            exit 1
          fi
          cp "$APK" "MoiMesta-v3.0.3.apk"
          ls -lh "MoiMesta-v3.0.3.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: MoiMesta-APK-v3.0.3
          path: MoiMesta-v3.0.3.apk
          if-no-files-found: error
          retention-days: 14
